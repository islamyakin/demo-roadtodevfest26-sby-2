name: app_latency
description: Request latency in ms per service and route
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name=("frontend" OR "backend") AND jsonPayload.message="request"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
    - key: service
    - key: route
valueExtractor: EXTRACT(jsonPayload.latency_ms)
labelExtractors:
  service: EXTRACT(jsonPayload.service)
  route: EXTRACT(jsonPayload.route)
bucketOptions:
  explicitBuckets:
    bounds: [25, 50, 100, 200, 300, 500, 750, 1000, 1500, 2000, 3000, 5000, 10000]
