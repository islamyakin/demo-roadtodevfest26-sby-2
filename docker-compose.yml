services:
  grafana:
    image: grafana/grafana:13.3.1  # Assistant needs >= 13.1; grafana-oss:latest is stuck at 13.0.2
    container_name: grafana-oss
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"  # localhost only: admin/admin must not be reachable on venue Wi-Fi
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Pre-install Grafana Assistant (butuh Grafana >= 13.1) + datasource Google Cloud Logging
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-assistant-app,googlecloud-logging-datasource
      # Konfigurasi yang dibutuhkan agar Grafana OSS dapat menggunakan Grafana Assistant
      - GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED=true
      - GF_FEATURE_TOGGLES_ENABLE=externalServiceAccounts
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}/}
      # Google Cloud: project untuk provisioning + ADC (gcloud auth application-default login)
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:?set GCP_PROJECT_ID in .env}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/adc.json
      # Grafana hides host env vars from external plugins; the Cloud Logging plugin needs the one above
      - GF_PLUGINS_FORWARD_HOST_ENV_VARS=googlecloud-logging-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ${GCP_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/etc/gcp/adc.json:ro
    depends_on:
      - gmp-frontend

  # Google's Managed Prometheus frontend: serves Cloud Monitoring's PromQL API on :19090 and signs each
  # request with your ADC. Grafana talks plain Prometheus to it, so there is no gcloud token to generate.
  gmp-frontend:
    image: gke.gcr.io/prometheus-engine/frontend:v0.19.5-gke.0
    container_name: gmp-frontend
    restart: unless-stopped
    command:
      - --query.project-id=${GCP_PROJECT_ID:?set GCP_PROJECT_ID in .env}
      - --query.credentials-file=/etc/gcp/adc.json
      - --web.listen-address=:19090
    volumes:
      - ${GCP_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/etc/gcp/adc.json:ro

volumes:
  grafana-storage:
